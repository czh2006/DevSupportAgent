[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsupport-backend"
version = "0.1.0"
description = "Backend for the DevSupport troubleshooting platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "demo_service*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

llm = [
    "langchain==0.3.27",
    "langchain-openai==0.3.30",
]